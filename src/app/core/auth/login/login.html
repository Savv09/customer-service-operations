<div class="flex items-center justify-center w-full h-screen bg-[#193f83]">
  <main class="flex flex-col items-center w-1/3 h-3/5 p-8 bg-white rounded-lg">
    <header class="mt-8 text-center">
      <h1 class="text-2xl font-bold text-[#636872]">Customer Service Operations</h1>
    </header>

    @if (!isLoading()) {
      <section class="w-full flex-1 mt-12">
        <form
          [formGroup]="loginForm"
          (ngSubmit)="login()"
          class="max-w-sm mx-auto"
          aria-label="Login form"
        >
          <h2 class="my-4 text-xl font-medium text-[#636872]">Reserved Area</h2>

          <div class="mb-5">
            <app-input-field
              label="Email"
              placeholder="Email"
              type="email"
              [control]="loginForm.controls.email"
              [externalError]="isLoginFailed()"
            />
          </div>

          <div class="mb-5">
            <app-input-field
              label="Password"
              placeholder="••••••••"
              type="password"
              [control]="loginForm.controls.password"
              [externalError]="isLoginFailed()"
            />
          </div>

          <button
            [disabled]="!loginForm.valid"
            type="submit"
            class="w-full h-12 mt-4 font-medium text-white bg-[#5e8fea] shadow-md rounded-lg cursor-pointer focus:outline-none"
            [ngClass]="{
              'bg-[#5e8feaaf] hover:bg-[#5e8feaaf] hover:cursor-not-allowed': !loginForm.valid,
              'bg-[#5e8fea] hover:bg-[#5183e0] hover:cursor-pointer': loginForm.valid,
            }"
          >
            LOGIN
          </button>
        </form>

        @if (isLoginFailed()) {
          <p class="w-full mt-2.5 text-base font-medium text-center text-[#c0392b]">
            Wrong username and/or password.
          </p>
        }
      </section>
    } @else {
      <div class="w-full h-3/4 flex flex-col items-center justify-center">
        <div class="loader"></div>
      </div>
    }
  </main>
</div>
