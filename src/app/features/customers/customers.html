<div class="flex flex-col h-full">
  <section class="w-full flex items-center mb-4">
    <button
      class="w-36 h-8 font-medium ml-2 text-base flex items-center justify-center text-[#5e8fea] outline-1 outline-[#5e8fea] rounded-md hover:bg-[#5e8fea] hover:text-white hover:cursor-pointer focus:outline-none"
      (click)="navigateToCreateCustomer()"
    >
      <mat-icon>add</mat-icon>
      <span> New customer </span>
    </button>
  </section>

  <cdk-virtual-scroll-viewport
    class="flex-1 min-h-0 w-full"
    [itemSize]="52"
    [maxBufferPx]="1200"
    [minBufferPx]="400"
  >
    <table
      mat-table
      [dataSource]="customerList()"
      class="mat-column-company mat-column-edit customers-list"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>NAME</th>
        <td
          mat-cell
          class="name-cell"
          *matCellDef="let element"
          (click)="navigateToDetails(element)"
        >
          {{ getFullName(element.firstName, element.lastName) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>EMAIL</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>COMPANY</th>
        <td mat-cell *matCellDef="let element">{{ element.company }}</td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef>EDIT</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button class="edit-button" (click)="navigateToEditCustomer(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnToDisplay; sticky: true"></tr>
      <tr mat-row class="element-row" *matRowDef="let row; columns: columnToDisplay"></tr>
    </table>
  </cdk-virtual-scroll-viewport>
</div>
