<div class="flex flex-col h-full">
  <section class="flex items-center justify-between w-full mb-4">
    <div class="flex items-center pt-0.5">
      <label class="mr-2 font-medium text-base text-[#78859c]">Search: </label>
      <input
        type="text"
        class="w-40 h-6 p-2 border rounded-md border-[#78859c] focus:outline-1 focus:outline-[#78859c] focus:bg-[#fcfcfa]"
        matInput
        (keyup)="searchCustomers($event)"
      />
    </div>

    <button
      class="flex items-center justify-center w-36 h-8 ml-2 font-medium text-base text-[#5e8fea] rounded-md outline-1 outline-[#5e8fea] hover:cursor-pointer hover:text-white hover:bg-[#5e8fea] focus:outline-none"
      (click)="navigateToCreateCustomer()"
    >
      <mat-icon>add</mat-icon>
      <span> New customer </span>
    </button>
  </section>

  <cdk-virtual-scroll-viewport
    class="flex-1 min-h-0 w-full"
    [itemSize]="52"
    [maxBufferPx]="1200"
    [minBufferPx]="400"
  >
    <table
      mat-table
      [dataSource]="filteredData()"
      class="mat-column-company mat-column-edit customers-list"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>NAME</th>
        <td
          mat-cell
          class="name-cell"
          *matCellDef="let element"
          (click)="navigateToDetails(element)"
        >
          {{ getFullName(element.firstName, element.lastName) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>EMAIL</th>
        <td mat-cell *matCellDef="let element">{{ element.email }}</td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>COMPANY</th>
        <td mat-cell *matCellDef="let element">{{ element.company }}</td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef>EDIT</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button class="edit-button" (click)="navigateToEditCustomer(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnToDisplay; sticky: true"></tr>
      <tr mat-row class="element-row" *matRowDef="let row; columns: columnToDisplay"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="columnToDisplay.length">No data available.</td>
      </tr>
    </table>
  </cdk-virtual-scroll-viewport>
</div>
