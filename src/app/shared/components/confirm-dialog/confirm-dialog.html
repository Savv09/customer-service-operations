<div class="bg-white shadow-xl p-6 w-105">
  <h2 class="text-xl font-semibold text-[#636872] mb-2">
    {{ data.title || 'Confirm' }}
  </h2>

  <p class="text-[#78859c] text-base mb-6">
    {{ data.message }}
  </p>

  <div class="flex justify-end gap-3">
    <button
      class="px-4 py-2 rounded-md font-medium bg-gray-200 hover:bg-gray-300 hover:cursor-pointer"
      (click)="onCancel()"
    >
      {{ data.cancelText || 'Cancel' }}
    </button>

    <button
      class="px-4 py-1 rounded-md bg-[#c0392b] text-base text-white font-medium hover:bg-[#ab3326] hover:cursor-pointer"
      (click)="onConfirm()"
    >
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
